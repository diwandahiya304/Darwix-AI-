formal: >-
  Mohon maaf, Bapak/Ibu, saya belum memiliki informasi tersebut saat
  ini. Saya bisa menghubungkan Bapak/Ibu dengan tim spesialis, atau
  menjadwalkan panggilan balik — mana yang lebih Bapak/Ibu inginkan?

colloquial: >-
  Maaf ya Kak, aku belum ada info soal itu sekarang. Aku bisa sambungin
  ke tim khusus, atau kita atur telepon balik aja — gimana enaknya?
