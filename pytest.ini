[pytest]
# Ensures repo root is on sys.path so `from kb import app`,
# `from voice_agent import app`, etc. resolve the same way regardless of
# which directory pytest is invoked from (root `make test` or a component's
# `make test-<name>` target).
pythonpath = .

# Each component's tests/ directory has no __init__.py, and several
# components each ship a same-named test_placeholder.py — the default
# "prepend" import mode resolves test modules by inserting directories
# onto sys.path and importing by bare file stem, which collides the
# moment more than one component's tests run in the same pytest process
# (e.g. `pytest kb/tests voice_agent/tests ...` from the repo root,
# instead of the Makefile's one-component-per-process targets).
# importlib mode imports each test file by its full path instead, so
# same-named test files across components never collide, without
# requiring an __init__.py in every tests/ dir.
addopts = --import-mode=importlib
